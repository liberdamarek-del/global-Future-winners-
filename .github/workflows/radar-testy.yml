# Testy při každé změně kódu (v0.16.0): python -m pytest (bez sítě, bez dat).
name: Radar testy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-provoz.txt
      - run: pip install -r requirements-provoz.txt
      - run: python -m pytest -q
