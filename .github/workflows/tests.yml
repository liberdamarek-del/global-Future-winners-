# Automatické testy na každou změnu: každý push (i přímý push rutin) a každý pull request.
# Runtime je jen standardní knihovna Pythonu 3.11+; testy nepoužívají síť ani e-mail uživatele.
name: Testy

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Závislosti pro testy
        run: python -m pip install -r requirements-dev.txt
      - name: pytest + pokrytí
        run: python -m pytest -q --cov=stockradar --cov-report=term --cov-report=xml
      - name: Souhrn pokrytí
        if: always() && matrix.python-version == '3.13'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("coverage.xml").getroot()
          print(f"**Pokrytí stockradar:** {float(r.get('line-rate')) * 100:.1f} % řádků")
          PY
