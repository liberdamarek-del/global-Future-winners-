# Radar na GitHub Actions (v0.16.0, docs/GITHUB_PROVOZ.md): týdenní globální objevování v sobotu (dřív rutina Claude
# „týdenní globální objevování“) bez ručního ověřování a bez zlepšování kódu (potřebují AI; uživatel je vypustil).
#
# Tři kroky jako samostatné joby (každý má na GitHubu nejvýš 6 h; první běh stahuje všechno znovu):
#   objevovani  discover --universe --download (seznamy firem, 5 let cen ~13 000 firem, SEC, ClinicalTrials, model raket)
#   smartmoney  smart-money + funds (SEC Form 4, Sněmovna, Senát, 13D/13G, buybacky, 13F)
#   signaly     signals + update + causal + diag + stránka
# Pracovní databáze (data/stockradar.db) jde mezi joby jako artefakt; cache dat (data/market_cache.db) přes cache
# GitHubu a ukládá se i po selhání, takže další běh pokračuje ve stahování. Režim jako v radar-denni.yml.
name: Radar týdenní objevování

on:
  schedule:
    - cron: "41 7 * * 6"      # sobota 9:41 Praha v letním čase
    - cron: "41 8 * * 6"      # sobota 9:41 Praha v zimním čase
    - cron: "41 12 * * 6"     # záložní slot
  workflow_dispatch:
    inputs:
      vynutit:
        description: "Spustit, i když tento týden už proběhlo"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: radar-provoz
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  STOCKRADAR_CONTACT_EMAIL: ${{ secrets.STOCKRADAR_CONTACT_EMAIL }}
  BEH_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bezet: ${{ steps.rozhodnuti.outputs.bezet }}
      tyden: ${{ steps.klice.outputs.tyden }}
      rezim: ${{ steps.klice.outputs.rezim }}
      hotovo: ${{ steps.hotovo.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/github_beh.py
            provoz/github.json
          sparse-checkout-cone-mode: false
      - id: klice
        run: |
          python3 tools/github_beh.py plan
          python3 tools/github_beh.py rezim
      - id: hotovo
        uses: actions/cache/restore@v6
        with:
          path: .znacka
          key: radar-beh-tyden-${{ steps.klice.outputs.tyden }}
          lookup-only: true
      - id: rozhodnuti
        env:
          VYNUTIT: ${{ github.event_name == 'workflow_dispatch' && inputs.vynutit }}
          HOTOVO: ${{ steps.hotovo.outputs.cache-hit }}
        run: |
          bezet=false
          if [ "$HOTOVO" != "true" ] || [ "$VYNUTIT" = "true" ]; then bezet=true; fi
          echo "bezet=$bezet" >> "$GITHUB_OUTPUT"; echo "beh: $bezet"

  objevovani:
    needs: plan
    if: needs.plan.outputs.bezet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/market_cache.db
            data/cache_kauzalni.pkl
          key: radar-data-${{ github.run_id }}-objevovani
          restore-keys: radar-data-
      - name: Databáze ze state/
        run: mkdir -p data zprava && rm -f data/stockradar.db && python -m stockradar init | tee zprava/objevovani.txt
      - name: Globální objevování (seznamy, ceny, SEC, studie, rakety, model raket)
        run: python -m stockradar discover --universe --download 2>&1 | tee -a zprava/objevovani.txt
      - name: Uložit cache dat (i po selhání - další běh pokračuje)
        if: always() && hashFiles('data/market_cache.db') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            data/market_cache.db
            data/cache_kauzalni.pkl
          key: radar-data-${{ github.run_id }}-objevovani
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: radar-db-objevovani
          path: |
            data/stockradar.db
            zprava/
          retention-days: 3

  smartmoney:
    needs: [plan, objevovani]
    if: ${{ !cancelled() && needs.plan.outputs.bezet == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: radar-db-objevovani
          path: .
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/market_cache.db
            data/cache_kauzalni.pkl
          key: radar-data-${{ github.run_id }}-smartmoney
          restore-keys: radar-data-
      - name: Databáze (z předchozího kroku, jinak ze state/)
        run: mkdir -p data zprava && python -m stockradar init | tee zprava/smartmoney.txt
      - name: Smart money (SEC Form 4, Sněmovna, Senát, 13D/13G, buybacky)
        id: sm
        continue-on-error: true
        run: python -m stockradar smart-money 2>&1 | tee -a zprava/smartmoney.txt
      - name: Fondy 13F (nová data jen čtvrtletně)
        id: fondy
        continue-on-error: true
        run: python -m stockradar funds 2>&1 | tee -a zprava/smartmoney.txt
      - name: Uložit cache dat
        if: always() && hashFiles('data/market_cache.db') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            data/market_cache.db
            data/cache_kauzalni.pkl
          key: radar-data-${{ github.run_id }}-smartmoney
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: radar-db-smartmoney
          path: |
            data/stockradar.db
            zprava/
          retention-days: 3
      - name: Selhání kroku
        if: steps.sm.outcome == 'failure' || steps.fondy.outcome == 'failure'
        run: echo "smart-money ${{ steps.sm.outcome }}, funds ${{ steps.fondy.outcome }}" && exit 1

  signaly:
    needs: [plan, smartmoney]
    if: ${{ !cancelled() && needs.plan.outputs.bezet == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      stranka: ${{ steps.kontrola.outcome }}
    env:
      STRANKA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-provoz.txt
      - run: pip install -r requirements-provoz.txt
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: radar-db-smartmoney
          path: .
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/market_cache.db
            data/cache_kauzalni.pkl
          key: radar-data-${{ github.run_id }}-signaly
          restore-keys: radar-data-
      - name: Databáze (z předchozího kroku, jinak ze state/)
        run: mkdir -p data zprava && python -m stockradar init | tee zprava/signaly.txt
      - name: Signály 14 dní, 1 měsíc, 6 měsíců
        id: signaly
        continue-on-error: true
        run: python -m stockradar signals 2>&1 | tee -a zprava/signaly.txt
      - name: Update (ceny, vyhodnocení, učení modelu, predikce, web)
        id: update
        run: python -m stockradar update 2>&1 | tee -a zprava/signaly.txt
      - name: Kauzální radar
        id: causal
        continue-on-error: true
        run: python -m stockradar causal 2>&1 | tee -a zprava/signaly.txt
      - name: Diagnostika a e-mail (jen hlásí)
        continue-on-error: true
        run: |
          python -m stockradar diag 2>&1 | tee zprava/diag.txt
          python -m stockradar email --days 1 2>&1 | tee zprava/email.txt
      - name: Testy
        id: testy
        continue-on-error: true
        run: python -m pytest -q 2>&1 | tail -15 | tee zprava/testy.txt
      - name: Souhrn
        if: always()
        run: python tools/github_beh.py souhrn tyden | tee zprava/souhrn.md

      - name: Uložit do repozitáře (jen ostrý režim)
        if: needs.plan.outputs.rezim == 'ostry' && steps.update.outcome == 'success'
        run: |
          git add state/
          if git diff --cached --quiet; then echo "nic nového k uložení"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "GitHub: týdenní objevování $(date -u +%F)" -m "Běh: $BEH_URL"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((2 ** i))
          done
          exit 1

      - name: Sestavit stránku
        if: steps.update.outcome == 'success'
        run: python tools/github_beh.py stranka --beh-url "$BEH_URL" --behy-url "${{ github.server_url }}/${{ github.repository }}/actions"
      - name: Kontrola stránky v prohlížeči
        id: kontrola
        if: steps.update.outcome == 'success'
        run: |
          kontrola() { python tools/github_beh.py kontrola-prohlizec _site --dom zprava/stranka.html 2>&1 | tee -a zprava/kontrola.txt; }
          kontrola || { echo "Chrome nešel, instaluji Chromium"; python -m playwright install --with-deps chromium > /dev/null && kontrola; }
      - uses: actions/upload-pages-artifact@v5
        if: steps.kontrola.outcome == 'success'
        with:
          path: _site

      - name: Uložit cache dat
        if: always() && hashFiles('data/market_cache.db') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            data/market_cache.db
            data/cache_kauzalni.pkl
          key: radar-data-${{ github.run_id }}-signaly
      - name: Značka hotového týdne
        if: steps.kontrola.outcome == 'success' && needs.plan.outputs.hotovo != 'true'
        run: mkdir -p .znacka && date -u > .znacka/hotovo
      - if: steps.kontrola.outcome == 'success' && needs.plan.outputs.hotovo != 'true'
        uses: actions/cache/save@v6
        with:
          path: .znacka
          key: radar-beh-tyden-${{ needs.plan.outputs.tyden }}

      - name: Oznámení na telefon (jen se secretem NTFY_TEMA)
        if: steps.kontrola.outcome == 'success'
        env:
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
        run: python tools/github_beh.py oznam tyden 2>&1 | tee -a zprava/oznameni.txt
      - name: Oznámení o selhání
        if: failure() || steps.signaly.outcome == 'failure' || steps.causal.outcome == 'failure' || needs.objevovani.result == 'failure' || needs.smartmoney.result == 'failure'
        env:
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
          KROKY: "objevovani=${{ needs.objevovani.result }} smartmoney=${{ needs.smartmoney.result }} signals=${{ steps.signaly.outcome }} update=${{ steps.update.outcome }} causal=${{ steps.causal.outcome }} testy=${{ steps.testy.outcome }} stranka=${{ steps.kontrola.outcome }}"
        run: mkdir -p zprava && python tools/github_beh.py oznam-chyba tyden 2>&1 | tee -a zprava/oznameni.txt

      - name: Zpráva o běhu (větev provoz-zprava)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          KROKY: "objevovani=${{ needs.objevovani.result }} smartmoney=${{ needs.smartmoney.result }} signals=${{ steps.signaly.outcome }} update=${{ steps.update.outcome }} causal=${{ steps.causal.outcome }} testy=${{ steps.testy.outcome }} stranka=${{ steps.kontrola.outcome }}"
        run: |
          mkdir -p zprava
          { echo "beh: $BEH_URL"; echo "workflow: $GITHUB_WORKFLOW"; echo "druh: tyden"; echo "stav jobu: $JOB_STATUS"; echo "kroky: $KROKY";
            echo "cache: $(du -h data/market_cache.db 2>/dev/null | cut -f1)"; date -u; } > zprava/README.txt
          rm -f zprava/*.db
          sed -i -E "s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<e-mail>/g" zprava/*.txt zprava/*.md zprava/*.html 2>/dev/null || true
          cd zprava && git init -q && git checkout -q -b provoz-zprava && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Zpráva o běhu $GITHUB_RUN_ID (tyden, $JOB_STATUS)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" provoz-zprava || echo "zprávu se nepodařilo uložit"

  stranka:
    needs: signaly
    if: always() && needs.signaly.outputs.stranka == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.nasazeni.outputs.page_url }}
    steps:
      - id: nasazeni
        uses: actions/deploy-pages@v5
